<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferramentas — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 1000px;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 mb-0">Ferramentas</h1>
        <button id="new-tool-btn" class="btn btn-primary btn-sm d-none" data-bs-toggle="modal" data-bs-target="#tool-modal">
          <i class="bi bi-plus-lg"></i> Nova ferramenta
        </button>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-8 col-md-6">
          <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Buscar ferramenta...">
        </div>
        <div class="col-4 col-md-3">
          <select id="filter-status" class="form-select form-select-sm">
            <option value="">Todos os status</option>
            <option value="DISPONIVEL">Disponível</option>
            <option value="EMPRESTADA">Emprestada</option>
            <option value="MANUTENCAO">Manutenção</option>
            <option value="INDISPONIVEL">Indisponível</option>
          </select>
        </div>
      </div>

      <div id="tools-grid" class="row g-3">
        <p class="text-body-secondary small">Carregando...</p>
      </div>
    </div>
  </div>

  <!-- Modal: nova ferramenta -->
  <div class="modal fade" id="tool-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="tool-form">
          <div class="modal-header">
            <h5 class="modal-title">Nova ferramenta</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-12">
              <label class="form-label small text-body-secondary">Nome</label>
              <input type="text" id="tool-name" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Patrimônio</label>
              <input type="text" id="tool-patrimonio" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Estado de conservação</label>
              <select id="tool-condition" class="form-select"></select>
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Fabricante</label>
              <input type="text" id="tool-manufacturer" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Modelo</label>
              <input type="text" id="tool-model" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Número de série</label>
              <input type="text" id="tool-serial" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label small text-body-secondary">Localização</label>
              <input type="text" id="tool-location" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label small text-body-secondary">Observações</label>
              <textarea id="tool-notes" class="form-control" rows="2"></textarea>
            </div>
            <div id="tool-form-error" class="alert alert-danger py-2 small d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar ferramenta</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: emprestar -->
  <div class="modal fade" id="loan-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="loan-form">
          <div class="modal-header">
            <h5 class="modal-title">Registrar empréstimo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-body-secondary" id="loan-tool-name"></p>
            <div class="mb-3">
              <label class="form-label small text-body-secondary">Previsão de devolução (opcional)</label>
              <input type="date" id="loan-expected-return" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label small text-body-secondary">Observações</label>
              <textarea id="loan-notes" class="form-control" rows="2"></textarea>
            </div>
            <div id="loan-form-error" class="alert alert-danger py-2 small d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Confirmar empréstimo</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/tools.js"></script>
</body>
</html>
