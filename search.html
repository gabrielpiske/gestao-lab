<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 900px;">
      <h1 class="h5 mb-3" id="search-title">Resultados da busca</h1>

      <p class="fw-medium small mb-2">Componentes</p>
      <div id="search-components" class="lt-card p-3 mb-4">
        <p class="text-body-secondary small mb-0">Carregando...</p>
      </div>

      <p class="fw-medium small mb-2">Microcontroladores</p>
      <div id="search-microcontrollers" class="lt-card p-3 mb-4">
        <p class="text-body-secondary small mb-0">Carregando...</p>
      </div>

      <p class="fw-medium small mb-2">Ferramentas</p>
      <div id="search-tools" class="lt-card p-3">
        <p class="text-body-secondary small mb-0">Carregando...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/search.js"></script>
</body>
</html>
