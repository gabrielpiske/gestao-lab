<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimentações — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 900px;">
      <h1 class="h5 mb-3">Movimentações</h1>
      <div class="lt-card">
        <table class="table table-sm mb-0 align-middle">
          <thead>
            <tr class="small text-body-secondary">
              <th class="ps-3">Componente</th>
              <th>Tipo</th>
              <th>Motivo</th>
              <th>Quantidade</th>
              <th>Usuário</th>
              <th class="pe-3">Data</th>
            </tr>
          </thead>
          <tbody id="movements-tbody">
            <tr><td class="ps-3 py-3 text-body-secondary small" colspan="6">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/movements.js"></script>
</body>
</html>
