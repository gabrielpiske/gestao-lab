<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Componente — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 760px;">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a href="components.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h1 class="h5 mb-0" id="page-title">Novo componente</h1>
      </div>

      <form id="component-form" class="lt-card p-4 mb-4">
        <div class="mb-3">
          <label class="form-label small text-body-secondary">Tipo de componente</label>
          <select id="component-type-select" class="form-select" required></select>
        </div>

        <div id="attributes-container" class="row g-3 mb-2"></div>

        <hr class="my-3">

        <div class="row g-3">
          <div class="col-6">
            <label class="form-label small text-body-secondary">Código interno</label>
            <input type="text" id="internal-code" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Localização</label>
            <input type="text" id="location" class="form-control" placeholder="ex.: Gaveta A3">
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Quantidade</label>
            <input type="number" id="quantity" class="form-control" min="0" value="0" required>
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Quantidade mínima</label>
            <input type="number" id="min-quantity" class="form-control" min="0" value="0" required>
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Fornecedor</label>
            <input type="text" id="supplier" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Fabricante</label>
            <input type="text" id="manufacturer" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Data de aquisição</label>
            <input type="date" id="acquisition-date" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label small text-body-secondary">Preço (opcional)</label>
            <input type="number" id="price" class="form-control" step="0.01" min="0">
          </div>
          <div class="col-12">
            <label class="form-label small text-body-secondary">Observações</label>
            <textarea id="notes" class="form-control" rows="2"></textarea>
          </div>
        </div>

        <div id="form-error" class="alert alert-danger py-2 small mt-3 d-none"></div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <a href="components.html" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" id="submit-btn" class="btn btn-primary">Salvar componente</button>
        </div>
      </form>

      <div id="stock-section" class="d-none">
        <div class="lt-card p-4 mb-4">
          <p class="fw-medium small mb-3">Registrar movimentação de estoque</p>
          <form id="movement-form" class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
              <label class="form-label small text-body-secondary">Tipo</label>
              <select id="movement-type" class="form-select form-select-sm">
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
              </select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Motivo</label>
              <select id="movement-reason" class="form-select form-select-sm"></select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small text-body-secondary">Quantidade</label>
              <input type="number" id="movement-quantity" class="form-control form-control-sm" min="1" value="1" required>
            </div>
            <div class="col-6 col-md-3">
              <button type="submit" class="btn btn-primary btn-sm w-100">Registrar</button>
            </div>
            <div class="col-12">
              <input type="text" id="movement-notes" class="form-control form-control-sm" placeholder="Observações (opcional)">
            </div>
          </form>
          <div id="movement-error" class="alert alert-danger py-2 small mt-3 d-none"></div>
        </div>

        <div class="lt-card p-4">
          <p class="fw-medium small mb-3">Histórico de movimentações</p>
          <div id="movements-list" class="d-flex flex-column gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/component-form.js"></script>
</body>
</html>
