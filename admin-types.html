<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administração — Tipos de componente — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 820px;">
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link active" href="admin-types.html">Tipos de componente</a></li>
        <li class="nav-item"><a class="nav-link" href="admin-users.html">Usuários</a></li>
        <li class="nav-item"><a class="nav-link" href="admin-history.html">Histórico & Auditoria</a></li>
      </ul>

      <h1 class="h5 mb-1">Tipos de componente</h1>
      <p class="small text-body-secondary mb-4">
        Crie novos tipos (ex.: Resistor, Capacitor, Sensor) e defina os atributos próprios de cada um. Não há uma lista
        fixa de tipos — crie quantos precisar, quando precisar.
      </p>

      <form id="new-type-form" class="d-flex gap-2 mb-4">
        <input type="text" id="new-type-name" class="form-control" placeholder="Nome do novo tipo (ex.: Push Button)" required>
        <button type="submit" class="btn btn-primary text-nowrap"><i class="bi bi-plus-lg"></i> Criar tipo</button>
      </form>

      <div id="types-accordion" class="d-flex flex-column gap-2">
        <p class="text-body-secondary small">Carregando...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin-types.js"></script>
</body>
</html>
