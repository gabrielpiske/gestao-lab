<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microcontroladores — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 1050px;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h1 class="h5 mb-0">Microcontroladores e Placas de Desenvolvimento</h1>
          <p class="text-body-secondary small mb-0">Controle e empréstimo de Arduinos, ESPs, Raspberry Pi Pico e kits de desenvolvimento.</p>
        </div>
        <button id="new-micro-btn" class="btn btn-primary btn-sm d-none">
          <i class="bi bi-plus-lg"></i> Novo microcontrolador
        </button>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-12 col-md-5">
          <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Buscar por modelo, família, patrimônio ou local...">
        </div>
        <div class="col-6 col-md-4">
          <select id="filter-family" class="form-select form-select-sm">
            <option value="">Todas as famílias/arquiteturas</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <select id="filter-status" class="form-select form-select-sm">
            <option value="">Todos os status</option>
            <option value="DISPONIVEL">Disponível</option>
            <option value="EMPRESTADA">Emprestado</option>
            <option value="MANUTENCAO">Manutenção</option>
            <option value="INDISPONIVEL">Indisponível</option>
          </select>
        </div>
      </div>

      <div id="micro-grid" class="row g-3">
        <p class="text-body-secondary small">Carregando...</p>
      </div>
    </div>
  </div>

  <!-- Modal: novo/editar microcontrolador -->
  <div class="modal fade" id="micro-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="micro-form">
          <div class="modal-header">
            <h5 class="modal-title" id="micro-modal-title">Novo microcontrolador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <input type="hidden" id="micro-id">

            <div class="col-12 col-md-7">
              <label class="form-label small text-body-secondary">Nome / Modelo <span class="text-danger">*</span></label>
              <input type="text" id="micro-name" class="form-control" placeholder="ex.: Arduino Uno R3, ESP32 DevKit V1, Pico W" required>
            </div>
            <div class="col-12 col-md-5">
              <label class="form-label small text-body-secondary">Família / Arquitetura <span class="text-danger">*</span></label>
              <select id="micro-family" class="form-select" required></select>
            </div>

            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Conectividade</label>
              <select id="micro-connectivity" class="form-select"></select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Patrimônio / ID do Kit</label>
              <input type="text" id="micro-patrimonio" class="form-control" placeholder="ex.: PAT-042 ou KIT-01">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Estado de conservação</label>
              <select id="micro-condition" class="form-select"></select>
            </div>

            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Fabricante / Marca</label>
              <input type="text" id="micro-manufacturer" class="form-control" placeholder="ex.: Arduino, Espressif, Raspberry Pi">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Tensão de operação / I/O</label>
              <input type="text" id="micro-voltage" class="form-control" placeholder="ex.: 5V, 3.3V">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-body-secondary">Localização no laboratório</label>
              <input type="text" id="micro-location" class="form-control" placeholder="ex.: Armário A - Gaveta 3, Bancada 2">
            </div>

            <div class="col-12">
              <label class="form-label small text-body-secondary">Observações / Acessórios inclusos</label>
              <textarea id="micro-notes" class="form-control" rows="2" placeholder="ex.: Acompanha cabo USB micro e shield de expansão."></textarea>
            </div>
            <div id="micro-form-error" class="alert alert-danger py-2 small d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" id="micro-submit-btn" class="btn btn-primary">Salvar microcontrolador</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: registrar empréstimo -->
  <div class="modal fade" id="micro-loan-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="micro-loan-form">
          <div class="modal-header">
            <h5 class="modal-title">Registrar empréstimo de microcontrolador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="fw-medium small mb-2" id="micro-loan-item-name"></p>
            <div class="mb-3">
              <label class="form-label small text-body-secondary">Previsão de devolução (opcional)</label>
              <input type="date" id="micro-loan-expected-return" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label small text-body-secondary">Observações do empréstimo</label>
              <textarea id="micro-loan-notes" class="form-control" rows="2" placeholder="ex.: Emprestado para aula prática de IoT da turma B"></textarea>
            </div>
            <div id="micro-loan-form-error" class="alert alert-danger py-2 small d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Confirmar empréstimo</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/microcontrollers.js"></script>
</body>
</html>
