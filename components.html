<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Componentes — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <div style="max-width: 1100px;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 mb-0">Componentes</h1>
        <a href="component-form.html" id="new-component-link" class="btn btn-primary btn-sm d-none">
          <i class="bi bi-plus-lg"></i> Novo componente
        </a>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-12 col-md-5">
          <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Buscar por código, localização, fabricante...">
        </div>
        <div class="col-6 col-md-3">
          <select id="filter-type" class="form-select form-select-sm">
            <option value="">Todos os tipos</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <select id="filter-availability" class="form-select form-select-sm">
            <option value="">Todas as disponibilidades</option>
            <option value="IN_STOCK">Em estoque</option>
            <option value="OUT_OF_STOCK">Sem estoque</option>
            <option value="CRITICAL">Estoque crítico</option>
          </select>
        </div>
      </div>

      <div class="lt-card">
        <table class="table table-sm mb-0 align-middle">
          <thead>
            <tr class="small text-body-secondary">
              <th class="ps-3">Tipo</th>
              <th>Código</th>
              <th>Quantidade</th>
              <th>Localização</th>
              <th>Fabricante</th>
            </tr>
          </thead>
          <tbody id="components-tbody">
            <tr><td class="ps-3 py-3 text-body-secondary small" colspan="5">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/components.js"></script>
</body>
</html>
