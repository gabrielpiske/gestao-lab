<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — LabTrack</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('labtrack_theme') || 'dark');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="lt-auth-page">
    <div class="lt-card lt-auth-card p-4">
      <h1 class="h5 mb-1">LabTrack</h1>
      <p class="text-body-secondary small mb-4">Gestão de componentes e ferramentas do laboratório</p>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label small text-body-secondary">Email</label>
          <input type="email" id="email" class="form-control" placeholder="voce@instituicao.edu.br" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small text-body-secondary">Senha</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div id="login-error" class="alert alert-danger py-2 small d-none"></div>

        <button type="submit" id="login-btn" class="btn btn-primary w-100 mb-3">Entrar</button>
      </form>

      <p class="small text-center text-body-secondary mb-0">
        Ainda não tem conta? <a href="register.html">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { auth } from "./js/firebase-config.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const loginBtn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("d-none");
      loginBtn.disabled = true;
      loginBtn.textContent = "Entrando...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = "Email ou senha inválidos.";
        errorBox.classList.remove("d-none");
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
